    label_bank_seed: 0
    plus_value: 1.0
    minus_value: 0.0
    rotate_tiles: true
    wrong_label_sampling: uniform_not_equal
    layout: TLBR_digit_TRBL_label
  grad_clip_norm: null
  margin_loss_weight: 0.15
  margin_loss_gap: 0.05
  margin_loss_ratio: 1.5
  max_epochs: 10
  eval_every: 8505
  ckpt_every: 20 
