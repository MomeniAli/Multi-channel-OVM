channel_num: 16
group_size: 1
onn:
  training_mode: supervised_ff
  n_layers: 5
  in_silico_mode: false
  phase_mask_shape:
  - 16
  - 112
  - 112
  phase_init: zeros
  phase_init_sigma: 0.5
  structural_nonlinearity: true
  alpha_map_hw:
  - 112
  - 112
  alpha_init: 0.25
  alpha_max: 1.0
  channel_sigma_init: 1.0
